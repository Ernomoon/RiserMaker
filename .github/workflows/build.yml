name: Build Windows plugin + installer

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target MoonRiser_VST3 --parallel

      - name: Show result
        shell: pwsh
        run: Get-ChildItem -Recurse -Directory -Filter "*.vst3" build | Select-Object FullName

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "installer\MoonRiser.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: MoonRiser-Windows
          path: installer/Output/MoonRiser-Setup.exe
