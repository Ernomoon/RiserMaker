name: Build Windows plugin + installer

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target RiserMaker_VST3 --parallel

      - name: Show result
        shell: pwsh
        run: Get-ChildItem -Recurse -Directory -Filter "*.vst3" build | Select-Object FullName

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "installer\RiserMaker.iss"

      - name: Zip plugin folder
        shell: pwsh
        run: |
          Compress-Archive -Path "build\RiserMaker_artefacts\Release\VST3\Riser Maker.vst3" -DestinationPath "RiserMaker-VST3-manual.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RiserMaker-Windows
          path: |
            installer/Output/RiserMaker-Setup.exe
            RiserMaker-VST3-manual.zip
